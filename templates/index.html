<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--    je vais ajouter link css -->
    <!--link rel="stylesheet" href="style.css"-->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>CALCULATRICE</title>
</head>
<body>

<div class="app">

    <!-- ===== PARTIE GAUCHE : calculatrice ===== -->
    <div class="calc-side">

        <!-- NAVBAR -->
        <nav class="navbar">
            <button class="hamburger">☰</button>
        
            <a href="{{ url_for('standard') }}" class="nav-item">Standard</a>
        
            <a href="{{ url_for('home') }}" class="nav-item active">Scientific</a>
        
            <a href="{{ url_for('graph') }}" class="nav-item">Graph</a>
        
            <a href="{{ url_for('programmer') }}" class="nav-item">Programmer</a>
        
            <a href="#" class="nav-item">Converter</a>
        
            <div class="theme-switch" id="themeToggle" role="button" tabindex="0" title="Mode clair/sombre">
                <div class="theme-switch-track">
                    <div class="theme-switch-knob"></div>
                </div>
            </div>
        </nav>

        <!-- DISPLAY -->
        <div class="display-wrapper">
            <div class="expression" id="expression"></div>
            <input type="text" id="display" readonly placeholder="0">
        </div>

        <!--MODE-->
        <div class="mode" id="mode">
            <span id="modeText">Deg</span>
        </div>

        <!-- FILTRES -->
        <div class="filters">
            <div class="filter-dropdown">
                <span>⊞ Trigonometry</span> <span>▾</span>
            </div>
            <div class="filter-dropdown">
                <span>⊞ Probability</span> <span>▾</span>
            </div>
            <div class="filter-dropdown">
                <span>∫ Calculus</span> <span>▾</span>
            </div>
            <button class="code-btn">‹›</button>
        </div>

        <!-- GRILLE DE BOUTONS -->
        <div class="btn">

            <!-- ligne 1 -->
            <button class="btn-mem">2nd</button>
            <button class="btn-mem">mr</button>
            <button class="btn-mem">m+</button>
            <button class="btn-mem">mc</button>
            <button class="btn-const">e</button>
            <button class="btn-clear-ce">CE</button>
            <button class="btn-clear">C</button>
            <button class="btn-clear">⌫</button>

            <!-- ligne 2 -->
             <!--    afficher sin⁻¹ sur le bouton quand 2nd est actif-->
            <button class="btn-sci" data-second="sin⁻¹">sin</button>
            <button class="btn-sci" data-second="cos⁻¹">cos</button>
            <button class="btn-sci" data-second="tan⁻¹">tan</button>
            <button class="btn-sci">S⇔D</button>
            <button class="btn-paren">(</button>
            <button class="btn-paren">)</button>
            <button class="btn-op">%</button>
            <button class="btn-op">÷</button>

            <!-- ligne 3 -->
            <button class="btn-sci">sec</button>
            <button class="btn-sci">csc</button>
            <button class="btn-sci">7</button>
            <button class="btn-sci">7</button>
            <button class="btn-num">7</button>
            <button class="btn-num">8</button>
            <button class="btn-num">9</button>
            <button class="btn-op">*</button>

            <!-- ligne 4 -->
            <button class="btn-sci">x²</button>
            <button class="btn-sci">x³</button>
            <button class="btn-sci">xʸ</button>
            <button class="btn-sci">eˣ</button>
            <button class="btn-num">4</button>
            <button class="btn-num">5</button>
            <button class="btn-num">6</button>
            <button class="btn-op">−</button>

            <!-- ligne 5 -->
            <button class="btn-sci">10ˣ</button>
            <button class="btn-sci">ln</button>
            <button class="btn-sci">2ˣ</button>
            <button class="btn-sci">|x|</button>
            <button class="btn-num">1</button>
            <button class="btn-num">2</button>
            <button class="btn-num">3</button>
            <button class="btn-op">+</button>

            <!-- ligne 6 -->
            <button class="btn-sci">Deg/Rad</button>
            <button class="btn-sci">logₓ</button>
            <button class="btn-sci">log꜀x</button>
            <button class="btn-sci">x!</button>
            <button class="btn-op">±</button>
            <button class="btn-num">0</button>
            <button class="btn-num">.</button>
            <button class="btn-equal">=</button>

        </div>
    </div>

    <!-- ===== PARTIE DROITE : historique ===== -->
    <aside class="sidebar-right">

        <div class="history-tabs">
            <button class="tab active">History</button>
            <button class="tab">Archive</button>
            <button class="tab-icon">💾</button>
        </div>

        <div class="history-list" id="historyList"></div>
        <div class="history-list" id="archiveList" style="display:none;"></div>

        <div class="history-footer">
            <span id="saveHistoryToggle">Save History</span>
            <button id="printHistory" title="Imprimer">🖨️</button>
            <button id="exportHistory" title="Exporter">📤</button>
            <button id="clearHistoryBtn" title="Vider">🗑️</button>
        </div>

    </aside>

</div>
<!--ajouter le javascrit relie avec flask-->
<script src="{{ url_for('static', filename='theme.js') }}"></script>
<script src="{{ url_for('static', filename='history.js') }}"></script>
<script src="{{ url_for('static', filename='javascript.js') }}"></script>
</body>
</html>
